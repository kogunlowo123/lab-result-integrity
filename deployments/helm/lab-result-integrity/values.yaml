replicaCount: 3

image:
  repository: ghcr.io/kogunlowo123/lab-result-integrity
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: lab-result-integrity
  # Cloud workload identity bindings, e.g.
  #   iam.gke.io/gcp-service-account (GKE Workload Identity, primary deployment)
  #   eks.amazonaws.com/role-arn (AWS IRSA)
  #   azure.workload.identity/client-id (Azure Workload ID)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
lri:
  environment: production
  publicUrl: ""  # REQUIRED: external HTTPS base URL (used in the A2A Agent Card)
  logLevel: INFO
  maxBatch: 500
  slaSweepIntervalSeconds: 60
  oidc:
    issuer: ""  # REQUIRED: enterprise OIDC issuer
    audience: ""  # REQUIRED: audience tokens for this service carry
    jwksUrl: ""  # REQUIRED: JWKS URL of the issuer
    rolesClaim: roles
    agentClaim: idtyp
    agentClaimValue: app
  # Optional: agent-identity-fabric base URL. When set, fabric-issued agent
  # credentials are accepted (introspected) and every action is also
  # authorized by the fabric; the most restrictive decision wins.
  fabricUrl: ""
  # REQUIRED: the laboratory-director approved analyte catalogue (YAML text,
  # governance.status: approved). The starter catalogue in the image is
  # refused in production.
  catalogue: ""
  narrative:
    enabled: false
    modelGatewayUrl: ""  # required when enabled
    model: ""  # required when enabled
  otlpEndpoint: ""  # optional OTLP gRPC endpoint

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: lab-result-integrity-database
  # Secret holding audit-<kid>.pem, the Ed25519 audit signing key.
  auditKey: lab-result-integrity-audit-key
  auditKeyFile: ""  # REQUIRED: file name of the audit key within secrets.auditKey

audit:
  storageClassName: ""
  size: 20Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: lab-result-integrity-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  # Namespaces whose pods may call the service (LIS middleware, agents).
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx
  # Extra egress ports, e.g. an in-cluster model gateway on 8080.
  extraEgressPorts: []

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
