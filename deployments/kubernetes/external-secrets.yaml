# Syncs secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates. The audit signing key is
# generated and stored by the security team outside Terraform (see
# docs/runbooks/startup.md) so it never appears in Terraform state.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lab-result-integrity-database
  namespace: lab-integrity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: lab-result-integrity-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: lab-result-integrity-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lab-result-integrity-audit-key
  namespace: lab-integrity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: lab-result-integrity-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^lab-result-integrity-audit-key-"
      rewrite:
        - regexp:
            source: "^lab-result-integrity-audit-key-(.*)$"
            target: "audit-$1.pem"
